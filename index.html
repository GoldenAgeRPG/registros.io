<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Registros - Golden Age RPG</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
   
  <style>
    /* --- ESTILO VISUAL DO PAINEL --- */
    :root {
      --bg: #101118; --panel: #1b1d29; --input-bg: #0c0d13; --border: #2a2d3d;
      --accent: #6D20C5; --accent-hover: #8a40e3; --text: #e0e0e0; --text-dim: #a0a0a0;
      --success: #20c56d; --danger: #c52020; --warn: #e08f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif; background-color: var(--bg); color: var(--text);
      padding: 20px; line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 20px; }
    h1 { color: var(--accent); font-weight: 900; font-size: 2.2em; margin-bottom: 10px; }
    p { color: var(--text-dim); }

    /* Controles */
    .controls-area {
      background-color: var(--panel); border: 1px solid var(--border); padding: 20px;
      border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap;
      gap: 20px; align-items: center; justify-content: space-between;
    }
    .mode-selector label { margin-right: 10px; font-weight: 700; color: var(--accent); }

    select, input[type="text"], input[type="url"] {
      background-color: var(--input-bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 4px; font-family: 'Roboto', sans-serif; width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    button {
      padding: 10px 20px; border: none; border-radius: 4px; font-weight: 700; cursor: pointer;
      transition: background 0.2s; color: #fff;
    }
    .btn-primary { background-color: var(--accent); }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-success { background-color: var(--success); }
    .btn-danger { background-color: var(--danger); }
    .btn-warn { background-color: var(--warn); color: #111; }

    /* Importação */
    .import-area {
      background-color: var(--panel); border: 1px dashed var(--border); padding: 20px;
      border-radius: 8px; margin-bottom: 20px;
    }
    .import-area h3 { color: var(--warn); margin-bottom: 10px; font-size: 1.1em; }
    textarea {
      width: 100%; height: 100px; background-color: var(--input-bg); border: 1px solid var(--border);
      color: var(--text-dim); font-family: 'Roboto Mono', monospace; font-size: 0.85em;
      padding: 10px; border-radius: 4px; resize: vertical; margin-bottom: 10px;
    }

    /* Processador Mágico */
    .magic-processor {
      background: linear-gradient(135deg, rgba(109, 32, 197, 0.1), rgba(32, 197, 109, 0.05));
      border: 1px solid var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 20px;
    }
    .magic-title { color: var(--accent); font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }

    /* Editor */
    .editor-form {
      background-color: var(--panel); border: 1px solid var(--border); padding: 20px;
      border-radius: 8px; margin-bottom: 30px; display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: end;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.8em; color: var(--text-dim); margin-bottom: 4px; font-weight: 700; }

    /* Lista */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    #search-bar { width: 300px; }

    .registry-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px;
      max-height: 500px; overflow-y: auto; padding-right: 5px;
    }
    .registry-list::-webkit-scrollbar { width: 8px; }
    .registry-list::-webkit-scrollbar-track { background: var(--bg); }
    .registry-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .registry-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .reg-card {
      background-color: var(--panel); border: 1px solid var(--border); padding: 10px;
      border-radius: 4px; display: flex; flex-direction: column; gap: 5px;
      position: relative; transition: transform 0.1s;
    }
    .reg-card:hover { border-color: var(--text-dim); }
    .reg-card.editing { border-color: var(--accent); background-color: rgba(109, 32, 197, 0.1); }

    .card-top { display: flex; justify-content: space-between; font-weight: 700; color: #fff; }
    .card-sub { font-size: 0.9em; color: var(--text-dim); display: flex; justify-content: space-between; }
    .card-actions { position: absolute; top: 5px; right: 5px; display: none; }
    .reg-card:hover .card-actions { display: flex; gap: 5px; }
    .action-btn { padding: 4px 8px; font-size: 0.8em; }

    .tag-status { font-size: 0.7em; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
    .tag-full { background: var(--danger); color: #fff; }
    .tag-open { background: var(--success); color: #000; }
    .tag-normal { background: var(--border); color: var(--text-dim); }

    /* Output */
    .output-area { margin-top: 40px; border-top: 2px dashed var(--border); padding-top: 20px; }
    .output-area h3 { color: var(--success); margin-bottom: 10px; }
    #final-code { height: 200px; color: var(--success); border-color: var(--success); }
    .hidden { display: none !important; }

    @media(max-width: 768px) {
      .editor-form { grid-template-columns: 1fr; }
      .controls-area { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Gerenciador de Registros</h1>
      <p>Golden Age RPG</p>
    </header>

    <div class="controls-area">
      <div class="mode-selector">
        <label>Modo de Edição:</label>
        <select id="registry-type">
          <option value="pp">Registro de Aparência (Photoplayer)</option>
          <option value="tech">Registro de Técnicas</option>
          <option value="part">Registro de Particularidades</option>
          <option value="clan">Registro de Clãs</option>
          <option value="school">Censo Escolar</option>
          <option value="faction">Registro de Facções</option>
        </select>
      </div>
      <div class="stats">
        <span id="total-items">0</span> itens cadastrados.
      </div>
    </div>

    <div class="import-area">
      <h3>1. Importar Lista Atual</h3>
      <textarea id="import-code" placeholder="Cole aqui o código HTML inteiro do tópico..."></textarea>
      <button class="btn-warn" id="btn-import">Carregar Lista</button>
    </div>

    <h3>2. Gerenciar Lista</h3>

    <div class="magic-processor">
      <div class="magic-title">🪄 Processador de Pedidos</div>
      <p style="font-size:0.9em; margin-bottom:10px; color:var(--text-dim);">Cole o pedido que o jogador postou no fórum e clique em "Ler".</p>
      <div style="display:flex; gap:10px; align-items: flex-start;">
        <textarea id="magic-input" style="height:100px; margin-bottom:0;" placeholder="Cole o pedido do jogador aqui..."></textarea>
        <button class="btn-primary" style="height:100px;" onclick="parseRequest()">Ler</button>
      </div>
    </div>

    <div class="editor-form">
      <div class="form-group special-only hidden">
        <label id="label-extra-1">Grupo (Clã/Escola/Facção)</label>
        <select id="edit-extra-1"></select>
      </div>
      <div class="form-group special-only hidden">
        <label id="label-extra-2">Subgrupo (Linhagem/Ano)</label>
        <select id="edit-extra-2"></select>
      </div>

      <div class="form-group">
        <label id="label-name">Nome (Personagem)</label>
        <input type="text" id="edit-name" placeholder="Nome">
      </div>
       
      <div class="form-group tech-only hidden">
        <label>Vagas (Ex: 0/3)</label>
        <input type="text" id="edit-count" placeholder="0/1">
      </div>
      <div class="form-group tech-only hidden">
        <label>Status</label>
        <select id="edit-status">
          <option value="">Normal</option>
          <option value="is-open">Livre</option>
          <option value="is-full">Cheio</option>
        </select>
      </div>

      <div class="form-group">
        <label>Usuário (@Nome)</label>
        <input type="text" id="edit-user" placeholder="@Usuario">
      </div>
      <div class="form-group">
        <label>Link da Ficha/Perfil</label>
        <input type="text" id="edit-link" placeholder="https://...">
      </div>
       
      <div class="form-group">
        <button class="btn-success" id="btn-add-update">Adicionar/Salvar</button>
      </div>
      <input type="hidden" id="edit-id">
    </div>

    <div class="list-header">
      <h4>Itens Atuais</h4>
      <input type="text" id="search-bar" placeholder="Filtrar...">
      <button class="btn-danger" id="btn-clear-all" style="font-size: 0.8em;">Limpar Tudo</button>
    </div>
    <div id="registry-list-visual" class="registry-list"></div>

    <div class="output-area">
      <h3>3. Código Final</h3>
      <textarea id="final-code" readonly></textarea>
      <button class="btn-success" id="btn-copy" style="width: 100%;">Copiar Código</button>
    </div>

  </div>

  <script>
    // --- ESTADO ---
    let registryItems = [];
    let currentMode = 'pp';
    let editingId = null;

    // --- SELETORES ---
    const typeSelect = document.getElementById('registry-type');
    const importBtn = document.getElementById('btn-import');
    const importText = document.getElementById('import-code');
    const listVisual = document.getElementById('registry-list-visual');
    const searchBar = document.getElementById('search-bar');
    const outputText = document.getElementById('final-code');
    const copyBtn = document.getElementById('btn-copy');
    const addUpdateBtn = document.getElementById('btn-add-update');
    const clearAllBtn = document.getElementById('btn-clear-all');
    const totalCountSpan = document.getElementById('total-items');
    
    const labelName = document.getElementById('label-name');
    const editName = document.getElementById('edit-name');
    const editCount = document.getElementById('edit-count');
    const editStatus = document.getElementById('edit-status');
    const editUser = document.getElementById('edit-user');
    const editLink = document.getElementById('edit-link');
    const editIdField = document.getElementById('edit-id');
    const magicInput = document.getElementById('magic-input');

    const editExtra1 = document.getElementById('edit-extra-1');
    const editExtra2 = document.getElementById('edit-extra-2');
    const labelExtra1 = document.getElementById('label-extra-1');
    const labelExtra2 = document.getElementById('label-extra-2');

    // --- DADOS ESTRUTURAIS ---
    const CLANS = [
        {val: 'gojo', label: 'Clã Gojo', color: '#3498db', main: 3, sec: 10, svg: '<svg class="clan-svg" viewBox="0 0 100 100" style="stroke: #3498db;"><circle cx="50" cy="50" r="40" /><path d="M50 10 L50 90 M10 50 L90 50" /><circle cx="50" cy="50" r="10" fill="#3498db" stroke="none" opacity="0.5"/></svg>'},
        {val: 'zenin', label: 'Clã Zenin', color: '#e74c3c', main: 3, sec: 10, svg: '<svg class="clan-svg" viewBox="0 0 100 100" style="stroke: #e74c3c;"><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" /><path d="M50 20 L50 80 M20 50 L80 50" /></svg>'},
        {val: 'kamo', label: 'Clã Kamo', color: '#c0392b', main: 3, sec: 10, svg: '<svg class="clan-svg" viewBox="0 0 100 100" style="stroke: #c0392b;"><path d="M50 15 Q80 15 80 50 Q80 85 50 85 Q20 85 20 50 Q20 15 50 15 Z" /><path d="M50 25 Q65 25 65 50 Q65 75 50 75 Q35 75 35 50 Q35 25 50 25 Z" fill="#c0392b" opacity="0.3"/></svg>'},
        {val: 'okkotsu', label: 'Clã Okkotsu', color: '#9b59b6', main: 2, sec: 10, svg: '<svg class="clan-svg" viewBox="0 0 100 100" style="stroke: #9b59b6;"><circle cx="50" cy="50" r="35" /><circle cx="50" cy="50" r="15" /><path d="M50 15 L50 35 M50 65 L50 85 M15 50 L35 50 M65 50 L85 50" /></svg>'},
        {val: 'inumaki', label: 'Clã Inumaki', color: '#f1c40f', main: 2, sec: 10, svg: '<svg class="clan-svg" viewBox="0 0 100 100" style="stroke: #f1c40f;"><circle cx="50" cy="50" r="35" /><path d="M35 50 L65 50 M35 40 L65 40 M35 60 L65 60" /><circle cx="35" cy="50" r="5" fill="#f1c40f" stroke="none" /><circle cx="65" cy="50" r="5" fill="#f1c40f" stroke="none" /></svg>'}
    ];
    const SCHOOLS = [
        {val: 'tokyo', label: 'Tokyo Metropolitan', icon: ':tokyo_tower:'},
        {val: 'kyoto', label: 'Kyoto Prefectural', icon: ':shinto_shrine:'}
    ];
    const GRADES = [
        {val: 'adm', label: 'Administração / Professores', isAdm: true},
        {val: '1ano', label: '1º Ano', limit: 9},
        {val: '2ano', label: '2º Ano', limit: 3},
        {val: '3ano', label: '3º Ano', limit: 3}
    ];
    const FACTIONS = [
        {val: 'tokyo', label: 'Legalistas', icon: '⚖️'},
        {val: 'kyoto', label: 'Pentarquia', icon: '👑'}
    ];

    // --- PARSER ---
    function parseRequest() {
      let text = magicInput.value;
      if (!text) return alert("Cole o pedido primeiro.");

      text = text.replace(/\[\/?[^\]]+\]/g, '').replace(/<[^>]*>/g, '');
      text = text.replace(/(Obra:|Nome do Personagem:|Link da Ficha:|Link:|Vagas:|Vagas Ocupadas:|Clã:|Linhagem:|Escola:|Ano\/Cargo:|Ficha:|Facção Escolhida:|Facção:|Link do RP de Entrada:|RP de Entrada:|RP:)/gi, '\n$1');
      
      const lines = text.split('\n');
      let data = {name:'', pp:'', obra:'', user:'', link:'', count:'', clan:'', lineage:'', school:'', grade:'', faction:''};

      lines.forEach(line => {
        const cleanLine = line.trim();
        if (!cleanLine) return;
        const val = (str) => {
            const idx = str.indexOf(':');
            return idx === -1 ? '' : str.substring(idx + 1).trim();
        };

        if (cleanLine.match(/^(Nome do Photoplayer|Photoplayer):/i)) data.pp = val(cleanLine);
        else if (cleanLine.match(/^(Obra|Anime|Manga|Origem):/i)) data.obra = val(cleanLine);
        else if (cleanLine.match(/^(Nome da Técnica|Nome da Particularidade|Nome):/i)) {
             if(!data.pp) data.name = val(cleanLine);
        }
        else if (cleanLine.match(/^(Nome do Personagem|Personagem|Usuário):/i)) data.user = val(cleanLine);
        else if (cleanLine.match(/^(Link|Link da Ficha|Ficha):/i)) data.link = val(cleanLine);
        else if (cleanLine.match(/^(Vagas|Vagas Ocupadas):/i)) data.count = val(cleanLine);
        else if (cleanLine.match(/^(Clã):/i)) data.clan = val(cleanLine);
        else if (cleanLine.match(/^(Linhagem):/i)) data.lineage = val(cleanLine);
        else if (cleanLine.match(/^(Escola):/i)) data.school = val(cleanLine);
        else if (cleanLine.match(/^(Ano\/Cargo|Ano|Cargo):/i)) data.grade = val(cleanLine);
        else if (cleanLine.match(/^(Facção Escolhida|Facção):/i)) data.faction = val(cleanLine);
      });

      // Aplicação dos dados
      if (currentMode === 'pp') {
          editName.value = data.pp ? (data.obra ? `${data.pp} (${data.obra})` : data.pp) : data.name;
      } else {
          editName.value = data.name || data.pp;
      }

      if (data.user) editUser.value = data.user;
      if (data.link) editLink.value = data.link;
      if (data.count) editCount.value = data.count;

      if (currentMode === 'clan' && data.clan) {
        const match = CLANS.find(c => c.label.toLowerCase().includes(data.clan.toLowerCase()) || data.clan.toLowerCase().includes(c.val));
        if(match) editExtra1.value = match.val;
        if(data.lineage) editExtra2.value = data.lineage.toLowerCase().includes('principal') ? 'Principal' : 'Secundária';
      }

      if (currentMode === 'school' && data.school) {
        if(data.school.toLowerCase().includes('tokyo')) editExtra1.value = 'tokyo';
        if(data.school.toLowerCase().includes('kyoto')) editExtra1.value = 'kyoto';
        
        if(data.grade) {
            if(data.grade.includes('1')) editExtra2.value = '1ano';
            else if(data.grade.includes('2')) editExtra2.value = '2ano';
            else if(data.grade.includes('3')) editExtra2.value = '3ano';
            else editExtra2.value = 'adm';
        }
      }

      if (currentMode === 'faction' && data.faction) {
        if(data.faction.toLowerCase().includes('legalista')) editExtra1.value = 'tokyo';
        if(data.faction.toLowerCase().includes('pentarquia')) editExtra1.value = 'kyoto';
      }

      magicInput.value = ""; 
      editName.focus();
    }

    // --- HTML PARSER (IMPORTAR) ---
    function parseHTML(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const items = [];

      // Modos Complexos (Clã/Escola/Facção)
      if (currentMode === 'clan' || currentMode === 'school' || currentMode === 'faction') {
         const columns = doc.querySelectorAll('.school-column');
         
         columns.forEach(col => {
             let groupKey = '';
             if(currentMode === 'clan') {
                 CLANS.forEach(c => { if(col.classList.contains(c.val)) groupKey = c.val; });
             } else if(currentMode === 'school') {
                 SCHOOLS.forEach(s => { if(col.classList.contains(s.val)) groupKey = s.val; });
             } else {
                 FACTIONS.forEach(f => { if(col.classList.contains(f.val)) groupKey = f.val; });
             }
             if(!groupKey) return; 

             const groups = col.querySelectorAll('.grade-group');
             groups.forEach(group => {
                 const title = group.querySelector('.grade-title').textContent.toLowerCase();
                 let subKey = '';

                 if (currentMode === 'clan') {
                     subKey = title.includes('principal') ? 'Principal' : 'Secundária';
                 } else if(currentMode === 'school') {
                     if(title.includes('1º')) subKey = '1ano';
                     else if(title.includes('2º')) subKey = '2ano';
                     else if(title.includes('3º')) subKey = '3ano';
                     else subKey = 'adm';
                 } else {
                     subKey = 'ativos';
                 }

                 const rawItems = group.querySelectorAll('li, .student-item, a');
                 const uniqueElements = new Set();
                 
                 rawItems.forEach(el => {
                     if(el.classList.contains('empty-slot')) return;
                     if(el.tagName === 'A' && el.parentElement.tagName === 'LI') return;
                     uniqueElements.add(el.tagName === 'A' ? el.parentElement : el);
                 });

                 uniqueElements.forEach(node => {
                     if(node.classList.contains('empty-slot')) return;
                     
                     let name = node.textContent.trim();
                     let link = '#';
                     const anchor = node.querySelector('a');
                     
                     if(anchor) {
                         name = anchor.textContent.trim();
                         link = anchor.getAttribute('href');
                     }
                     // Limpeza visual
                     name = name.replace(/^●\s*/, '').replace(/^\s*-\s*/, '').replace(/Diretora? - .*/, '').replace(/Docente/, '').trim();

                     if(name && name !== '- Vaga Disponível -') {
                        items.push({
                           id: Date.now() + Math.random(),
                           name, count: '', status: '', user: '', link,
                           extra1: groupKey, extra2: subKey
                        });
                     }
                 });
             });
         });
      } else {
        // Modos Simples
        doc.querySelectorAll('.jjk-reg-item').forEach(el => {
            const name = el.querySelector('.jjk-reg-name')?.textContent.trim() || '';
            const count = el.querySelector('.jjk-reg-count')?.textContent.trim() || '';
            const userLink = el.querySelector('.jjk-reg-users a');
            const userText = el.querySelector('.jjk-reg-users')?.textContent.trim() || '';
            
            items.push({ 
                id: Date.now() + Math.random(), 
                name, count, 
                status: el.classList.contains('is-full') ? 'is-full' : (el.classList.contains('is-open') ? 'is-open' : ''),
                user: userLink ? userLink.textContent.trim() : userText, 
                link: userLink ? userLink.getAttribute('href') : '#' 
            });
        });
      }
      return items;
    }

    // --- RENDERIZAR LISTA NO PAINEL ---
    function renderList() {
      listVisual.innerHTML = '';
      const filter = searchBar.value.toLowerCase();

      const filteredItems = registryItems
        .filter(item => item.name.toLowerCase().includes(filter) || (item.user && item.user.toLowerCase().includes(filter)))
        .sort((a, b) => a.name.localeCompare(b.name));

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `reg-card ${editingId === item.id ? 'editing' : ''}`;
        
        let extraInfo = '';
        if (currentMode === 'clan' || currentMode === 'school' || currentMode === 'faction') {
            let l1 = item.extra1; let l2 = item.extra2;
            if(currentMode === 'clan') {
                const c = CLANS.find(x => x.val === l1); if(c) l1 = c.label;
            } else if(currentMode === 'school') {
                const s = SCHOOLS.find(x => x.val === l1); if(s) l1 = s.label;
                const g = GRADES.find(x => x.val === l2); if(g) l2 = g.label;
            } else {
                const f = FACTIONS.find(x => x.val === l1); if(f) l1 = f.label;
                l2 = 'Membros Ativos';
            }
            extraInfo = `<div style="font-size:0.8em; color:var(--accent); margin-top:2px;">${l1} ${currentMode !== 'faction' ? '• ' + l2 : ''}</div>`;
        }

        card.innerHTML = `
          <div class="card-top"><span>${item.name}</span></div>
          <div class="card-sub"><span>${item.user || ''}</span></div>
          ${extraInfo}
          <div class="card-actions">
            <button class="action-btn btn-primary" onclick="startEdit(${item.id})">✏️</button>
            <button class="action-btn btn-danger" onclick="deleteItem(${item.id})">🗑️</button>
          </div>
        `;
        listVisual.appendChild(card);
      });
      totalCountSpan.textContent = registryItems.length;
      generateOutput();
    }

    // --- CRUD ---
    function startEdit(id) {
      const item = registryItems.find(i => i.id === id);
      if (!item) return;

      editName.value = item.name;
      editCount.value = item.count;
      editStatus.value = item.status;
      editUser.value = item.user;
      editLink.value = item.link;
      editIdField.value = item.id;

      if (currentMode === 'clan' || currentMode === 'school' || currentMode === 'faction') {
          editExtra1.value = item.extra1;
          editExtra2.value = item.extra2;
      }
      
      editingId = id;
      addUpdateBtn.textContent = "Salvar";
      addUpdateBtn.classList.add('btn-warn');
      editName.focus();
      renderList();
    }

    function saveItem() {
      const name = editName.value.trim();
      if (!name) return alert("Nome obrigatório!");

      const newItem = {
        id: editIdField.value ? parseFloat(editIdField.value) : Date.now(),
        name: name,
        count: editCount.value.trim(),
        status: editStatus.value,
        user: editUser.value.trim(),
        link: editLink.value.trim() || '#',
        extra1: editExtra1.value,
        extra2: currentMode === 'faction' ? 'ativos' : editExtra2.value
      };

      if (editingId) {
        const index = registryItems.findIndex(i => i.id === editingId);
        if (index !== -1) registryItems[index] = newItem;
        editingId = null;
        addUpdateBtn.textContent = "Adicionar";
        addUpdateBtn.classList.remove('btn-warn');
      } else {
        registryItems.push(newItem);
      }
      
      // Limpar
      editName.value = ''; editCount.value = ''; editUser.value = ''; editLink.value = ''; editIdField.value = '';
      renderList();
    }

    window.deleteItem = function(id) {
      if(confirm("Remover?")) {
        registryItems = registryItems.filter(i => i.id !== id);
        renderList();
      }
    }

    // --- GERADOR DE HTML (ESTRUTURA RIGIDA) ---
    function generateOutput() {
      const sortedItems = [...registryItems].sort((a, b) => a.name.localeCompare(b.name));
      let finalHTML = '';

      if (currentMode === 'clan') {
        const css = `<link href="https://gaaaaaaaaabs.github.io/goldenagerepositor.io/registro-escolas.css" rel="stylesheet" type="text/css"> <style> .clan-grid-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; } .clan-svg { width: 50px; height: 50px; fill: none; stroke: var(--accent-color, #9b59b6); stroke-width: 2; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; } .gojo .grade-title { border-left-color: #3498db !important; } .zenin .grade-title { border-left-color: #e74c3c !important; } .kamo .grade-title { border-left-color: #c0392b !important; } .inumaki .grade-title { border-left-color: #f1c40f !important; } .okkotsu .grade-title { border-left-color: #9b59b6 !important; } </style>`;
        
        let cols = '';
        CLANS.forEach(c => {
             const items = sortedItems.filter(i => i.extra1 === c.val);
             const main = items.filter(i => i.extra2 === 'Principal');
             const sec = items.filter(i => i.extra2 === 'Secundária');
             
             const buildList = (list, max) => {
                 let html = '';
                 list.forEach(i => {
                     html += `<li class="student-item" style="list-style:none; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><a href="${i.link}" style="text-decoration:none; color:inherit;">${i.name}</a></li>`;
                 });
                 for(let k=list.length; k<max; k++) html += `<div class="empty-slot">- Vaga Disponível -</div>`;
                 return html;
             };

             cols += `<div class="school-column ${c.val}"> <div class="school-header"> ${c.svg} <div class="school-name">${c.label}</div> <div class="school-counter">Vagas Principais: ${c.main}</div> </div> <div class="grade-list"> <div class="grade-group"> <div class="grade-title" style="color:${c.color};">Linhagem Principal <span class="grade-count">(${main.length}/${c.main})</span></div> <ul class="student-list"> ${buildList(main, c.main)} </ul> </div> <div class="grade-group"> <div class="grade-title">Linhagem Secundária <span class="grade-count">(${sec.length}/${c.sec})</span></div> <ul class="student-list"> ${buildList(sec, c.sec)} </ul> </div> </div> </div>`;
        });

        const reqBox = `<div class="census-request-box"> <div class="req-title">NOVO REGISTRO DE CLÃ</div> <div class="req-desc" style="margin-bottom: 10px; font-size: 0.9em; color: #a0a0a0;">Copie o código abaixo e responda ao tópico:</div> <textarea class="req-code" readonly onclick="this.select();"> Nome: Nome do Personagem\nClã: Gojo / Zenin / Kamo / Okkotsu / Inumaki\nLinhagem: Principal / Secundária\nFicha: Link_da_Ficha</textarea> </div>`;
        
        finalHTML = `${css}<div class="school-census-container"> <div class="census-header"> <h1 class="census-title">Registro de Linhagens</h1> <div class="census-subtitle">Censo Oficial das Famílias Jujutsu</div> </div> <div class="clan-grid-wrapper"> ${cols} </div> ${reqBox} <div class="census-footer">Atualizado em: ${new Date().toLocaleDateString('pt-BR')}</div> </div>`;

      } else if (currentMode === 'school') {
        const css = `<link href="https://gaaaaaaaaabs.github.io/goldenagerepositor.io/registro-escolas.css" rel="stylesheet" type="text/css">`;
        
        let cols = '';
        SCHOOLS.forEach(s => {
             const items = sortedItems.filter(i => i.extra1 === s.val);
             let grades = '';
             
             GRADES.forEach(g => {
                 const gItems = items.filter(i => i.extra2 === g.val);
                 let listHtml = '';
                 
                 gItems.forEach(i => {
                     const tag = g.isAdm ? `<span class="student-grade-tag">Docente</span>` : '';
                     listHtml += `<li class="student-item"><a href="${i.link}" class="student-link" target="_blank"><span class="status-dot active"></span> ${i.name}</a>${tag}</li>`;
                 });

                 if(!g.isAdm) {
                     for(let k=gItems.length; k < g.limit; k++) listHtml += `<div class="empty-slot">- Vaga Disponível -</div>`;
                 }
                 
                 const counter = g.isAdm ? '' : `<span class="grade-count">(${gItems.length}/${g.limit})</span>`;
                 grades += `<div class="grade-group"><div class="grade-title">${g.label} ${counter}</div><ul class="student-list">${listHtml}</ul></div>`;
             });

             cols += `<div class="school-column ${s.val}"><div class="school-header"><div class="school-bg-icon" style="font-size: 60px !important; line-height: 1 !important; display: block !important; margin-bottom: 10px !important;">${s.icon}</div><div class="school-name">${s.label}</div><div class="school-counter">Total: ${items.length} Alunos</div></div><div class="grade-list">${grades}</div></div>`;
        });

        const reqBox = `<div class="census-request-box"><div class="req-title">NOVO REGISTRO</div><div class="req-desc" style="margin-bottom: 10px; font-size: 0.9em; color: #a0a0a0;">Copie o código abaixo e responda ao tópico:</div><textarea class="req-code" readonly onclick="this.select();">Nome: Nome do Personagem\nEscola: Tokyo / Kyoto\nAno/Cargo: 1º Ano / Professor\nFicha: Link_da_Ficha</textarea></div>`;

        finalHTML = `${css}<div class="school-census-container"><div class="census-header"><h1 class="census-title">Censo Escolar</h1><div class="census-subtitle">Registro Oficial de Estudantes e Corpo Docente</div></div><div class="schools-grid">${cols}</div>${reqBox}<div class="census-footer">Atualizado em: ${new Date().toLocaleDateString('pt-BR')}</div></div>`;

      } else if (currentMode === 'faction') {
        const css = `<link href="https://gaaaaaaaaabs.github.io/goldenagerepositor.io/registro-escolas.css" rel="stylesheet" type="text/css">
<style>
:root { --legalista-accent: #3498db; --legalista-dark: #1f3a58; --pentarquia-accent: #e74c3c; --pentarquia-dark: #4a1714; }
.school-column.tokyo .school-header { background: linear-gradient(135deg, var(--legalista-dark), var(--reg-bg)); border-bottom: 3px solid var(--legalista-accent); }
.school-column.tokyo .grade-title { background: rgba(52, 152, 219, 0.1); color: #85c1e9; border-bottom: 1px solid rgba(52, 152, 219, 0.2); }
.school-column.tokyo .status-dot.active { background: #3498db; box-shadow: 0 0 5px #3498db; }
.school-column.kyoto .school-header { background: linear-gradient(135deg, var(--pentarquia-dark), var(--reg-bg)); border-bottom: 3px solid var(--pentarquia-accent); }
.school-column.kyoto .grade-title { background: rgba(231, 76, 60, 0.1); color: #f1948a; border-bottom: 1px solid rgba(231, 76, 60, 0.2); }
.school-column.kyoto .status-dot.active { background: #e74c3c; box-shadow: 0 0 5px #e74c3c; }
</style>`;

        let cols = '';
        FACTIONS.forEach(f => {
            const items = sortedItems.filter(i => i.extra1 === f.val);
            let listHtml = '';
            items.forEach(i => {
                listHtml += `<li class="student-item"><a href="${i.link}" class="student-link" target="_blank"><span class="status-dot active"></span> ${i.name}</a></li>`;
            });

            cols += `<div class="school-column ${f.val}">
                <div class="school-header">
                    <div class="school-bg-icon" style="font-size: 60px !important; line-height: 1 !important; display: block !important; margin-bottom: 10px !important;">${f.icon}</div>
                    <div class="school-name">${f.label}</div>
                    <div class="school-counter">Total de Filiados: ${items.length}</div>
                </div>
                <div class="grade-list">
                    <div class="grade-group">
                        <div class="grade-title">Membros Ativos</div>
                        <ul class="student-list">${listHtml}</ul>
                    </div>
                </div>
            </div>`;
        });

        const reqBox = `<div class="census-request-box">
            <div class="req-title">NOVO ALISTAMENTO</div>
            <div class="req-desc" style="margin-bottom: 10px; font-size: 0.9em; color: #a0a0a0;">Copie o código abaixo e responda ao tópico para registrar a sua lealdade:</div>
[code][b]Nome do Personagem:[/b] 
[b]Facção Escolhida:[/b] (Legalista ou Pentarquia)
[b]Link da Ficha:[/b] 
[b]Link do RP de Entrada:[/b][/code]
        </div>`;

        finalHTML = `${css}<div class="school-census-container"><div class="census-header"><h1 class="census-title">Registro de Facções</h1><div class="census-subtitle">Alistamento Oficial da Guerra Ideológica</div></div><div class="schools-grid">${cols}</div>${reqBox}<div class="census-footer">A guerra não espera os indecisos.</div></div>`;

      } else {
        // Modos Simples
        let title='', reqT='', rules='', reqC='', listC='';
        if(currentMode==='pp'){
             title='Registro de Photoplayer'; reqT='Faça seu Registro'; reqC=`Nome do Photoplayer: Nome do Anime/Manga\nNome do Personagem: Nome da sua Ficha\nLink da Ficha: URL`;
             rules=`<div class="jjk-registry-rules"><h4>Regras de Uso</h4><ul><li>Photoplayers apenas fictícios.</li><li>Ausência de 14 dias libera o PP.</li></ul></div>`;
        } else if(currentMode==='tech'){
             title='Registro de Técnicas'; reqT='Solicitação de Técnica'; reqC=`Nome da Técnica: ...\nNome do Personagem: ...\nVagas Ocupadas: 0/1\nLink da Ficha: URL`;
             rules=`<div class="jjk-registry-rules"><h4>Regras</h4><ul><li>Ausência de 14 dias libera a vaga.</li></ul></div>`;
        } else {
             title='Registro de Particularidades'; reqT='Solicitação'; reqC=`Nome da Particularidade: ...\nNome do Personagem: ...\nVagas Ocupadas: 0/1\nLink da Ficha: URL`;
             rules=`<div class="jjk-registry-rules"><h4>Regras</h4><ul><li>Geralmente 1 por personagem.</li></ul></div>`;
        }
        
        if (currentMode === 'part') {
            sortedItems.forEach(i => { listC += `<div class="jjk-reg-item ${i.status}"><div class="jjk-reg-info"><span class="jjk-reg-name">${i.name}</span><span class="jjk-reg-count">${i.count}</span></div><div class="jjk-reg-users"><a href="${i.link}">${i.user}</a></div></div>`; });
        } else {
             const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
             alpha.forEach(letter => {
                listC += `<div class="jjk-reg-letter">${letter}</div>`;
                sortedItems.forEach(item => {
                    if(item.name.trim().charAt(0).toUpperCase() === letter) {
                        const extra = currentMode==='pp' ? '' : `<span class="jjk-reg-count">${item.count}</span>`;
                        listC += `<div class="jjk-reg-item ${item.status||''}"><div class="jjk-reg-info"><span class="jjk-reg-name">${item.name}</span>${extra}</div><div class="jjk-reg-users"><a href="${item.link}">${item.user}</a></div></div>`;
                    }
                });
             });
        }
        finalHTML = `<link href="https://gaaaaaaaaabs.github.io/goldenagerepositor.io/registro.css" rel="stylesheet" type="text/css"><div class="jjk-registry-container"><div class="jjk-registry-title">${title}</div>${rules}<div class="jjk-registry-list">${listC}</div><div class="jjk-request-section"><div class="jjk-request-title">${reqT}</div><div style="margin-bottom: 10px; font-size: 0.9em; color: #a0a0a0;">Copie o código:</div><textarea class="jjk-copy-area" readonly onclick="this.select();">${reqC}</textarea></div></div>`;
      }

      outputText.value = finalHTML.replace(/(\r\n|\n|\r)/gm, "").replace(/\s+/g, ' ').replace(/> </g, '><').trim();
    }

    // --- UTILS ---
    function populateExtras() {
        editExtra1.innerHTML = ''; editExtra2.innerHTML = '';
        if(currentMode === 'clan') {
            CLANS.forEach(c => editExtra1.add(new Option(c.label, c.val)));
            ['Principal', 'Secundária'].forEach(v => editExtra2.add(new Option(v, v)));
            labelExtra1.textContent = 'Clã'; labelExtra2.textContent = 'Linhagem';
        } else if (currentMode === 'school') {
            SCHOOLS.forEach(s => editExtra1.add(new Option(s.label, s.val)));
            GRADES.forEach(g => editExtra2.add(new Option(g.label, g.val)));
            labelExtra1.textContent = 'Escola'; labelExtra2.textContent = 'Ano / Cargo';
        } else if (currentMode === 'faction') {
            FACTIONS.forEach(f => editExtra1.add(new Option(f.label, f.val)));
            editExtra2.add(new Option('Membros Ativos', 'ativos'));
            labelExtra1.textContent = 'Facção'; labelExtra2.textContent = '';
        }
    }

    typeSelect.addEventListener('change', (e) => {
      currentMode = e.target.value;
      const tF = document.querySelectorAll('.tech-only');
      const sF = document.querySelectorAll('.special-only');
      tF.forEach(el => el.classList.add('hidden'));
      sF.forEach(el => el.classList.add('hidden'));

      if(currentMode === 'pp') {
        editName.placeholder = "Personagem (Obra)"; labelName.textContent = "Nome";
      } else if (currentMode === 'tech' || currentMode === 'part') {
        tF.forEach(el => el.classList.remove('hidden'));
        labelName.textContent = "Nome";
        editName.placeholder = "Nome";
      } else if (currentMode === 'clan' || currentMode === 'school' || currentMode === 'faction') {
        sF.forEach(el => el.classList.remove('hidden'));
        populateExtras();
        labelName.textContent = "Nome (Personagem)";
        editName.placeholder = "Nome";
        
        if (currentMode === 'faction') {
           editExtra2.parentElement.classList.add('hidden');
        } else {
           editExtra2.parentElement.classList.remove('hidden');
        }
      }
      renderList();
    });

    importBtn.addEventListener('click', () => {
       const res = parseHTML(importText.value);
       if(res.length) { registryItems = res; renderList(); alert(res.length + ' carregados.'); }
       else alert('Nada encontrado.');
    });

    addUpdateBtn.addEventListener('click', saveItem);
    searchBar.addEventListener('input', renderList);
    copyBtn.addEventListener('click', () => { outputText.select(); document.execCommand('copy'); });
    clearAllBtn.addEventListener('click', () => { if(confirm("Limpar tudo?")) { registryItems = []; renderList(); }});
    typeSelect.dispatchEvent(new Event('change'));

  </script>
</body>
</html>
